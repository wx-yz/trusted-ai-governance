# Mock Salesforce MCP server, deployed next to Agent Manager in the same cluster.
#   8080  MCP endpoint (/mcp) and /healthz. The only port that is ever published (see deploy/expose-mcp.sh).
#   8081  /audit, /catalog, /admin/reset for the dashboard. Keep it private.
# The ungoverned agent reaches the MCP port in-cluster: http://salesforce-mcp.sales-demo.svc.cluster.local:8080/mcp
# The pod reads its API keys from the Secret salesforce-mcp-keys, which deploy/deploy-mcp.sh creates with random values.
apiVersion: v1
kind: Namespace
metadata:
  name: sales-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesforce-mcp
  namespace: sales-demo
  labels: { app: salesforce-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: salesforce-mcp }
  template:
    metadata:
      labels: { app: salesforce-mcp }
    spec:
      containers:
        - name: salesforce-mcp
          image: salesforce-mcp:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: SF_ADMIN_PORT
              value: "8081"
          envFrom:
            - secretRef: { name: salesforce-mcp-keys }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: salesforce-mcp
  namespace: sales-demo
spec:
  selector: { app: salesforce-mcp }
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
    - name: admin
      port: 8081
      targetPort: 8081
